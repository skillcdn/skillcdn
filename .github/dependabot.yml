version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml: never adopt a release younger than 3 days.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # The Node.js major is pinned on purpose (.nvmrc, devEngines, Dockerfile) and moves by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      toolchain:
        patterns:
          - "@biomejs/*"
          - "turbo"
          - "typescript"
          - "vitest"
          - "@types/*"
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # A PostgreSQL major needs a data migration, not a pull request.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
