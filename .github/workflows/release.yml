name: Release

# Versions and publishes the npm packages (ADR-0045). With changesets pending, it opens or
# updates the pull request that bumps versions and changelogs. Once that is merged and nothing is
# pending, it publishes the versions the registry does not have yet, through the registry's
# trusted publishing: no stored token, a short-lived identity the publish job proves, and a
# provenance attestation on every published version. The image of the release follows, built
# from the same commit and pushed to this repository's own container registry with the token of
# its job (ADR-0087): no stored secret there either, and nothing of any deployment. Each platform
# is built on a runner of its own, and a release the registry has no image of is given it by the
# next run (ADR-0116).

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job declares what it needs.
permissions: {}

jobs:
  mode:
    name: What is pending
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version pull request
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the version commit, pushed through the API and signed by GitHub
      pull-requests: write # the pull request it is proposed in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs `changeset version`; the changelog links every entry to its commit.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore(repo): version packages"
          pr-title: "chore(repo): version packages"

  pack:
    name: Build and pack
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@skillcdn/core --filter=@skillcdn/indexer --filter=@skillcdn/inference --filter=@skillcdn/reader --filter=@skillcdn/client --filter=@skillcdn/serve --filter=@skillcdn/cli
      # Packs what the publish plan names; the tarballs travel to the publish job as an artifact,
      # so the job that holds the publishing identity builds nothing.
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: [mode, pack]
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # trusted publishing: the identity the registry checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs `changeset publish --from-pack-dir`, which publishes each tarball with `pnpm publish`;
      # pnpm exchanges the job's identity for a short-lived registry token and attaches provenance.
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
        env:
          npm_config_provenance: "true"

  # The image of the release (ADR-0087, ADR-0116), in three jobs. They run after the publish where
  # there was one, and on every other push as well: the first asks which release this commit is
  # of, whether its packages are published and whether the registry has its image. So a release
  # that lost its image to a failed job is given it by the next push, built from the commit of
  # the release and not from the one pushed.
  image-plan:
    name: Which image is missing
    needs: [mode, publish]
    # A job that needs a skipped one is skipped unless it says what it waits for, and so is every
    # job after it: each of the three says so. A fork publishes no image.
    if: ${{ !cancelled() && !github.event.repository.fork && needs.mode.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # whether the registry has the image
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to the registry with the token of this job
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: The release this commit is of, and whether its image is to be built
        id: plan
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' packages/cli/package.json | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag the publish job makes says the packages of this version are published, and
          # names the commit they were published from. Without it there is no release yet.
          tag="refs/tags/@skillcdn/cli@$version"
          commit=$(git ls-remote origin "$tag" "$tag^{}" | tail -n 1 | cut -f 1)
          if [ -z "$commit" ]; then
            echo "The packages of $version are not published: there is no image to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # A version the registry has is never built again: a tag means one image for good. So
          # only the registry saying that it has none starts a build; anything else it says, or
          # no answer, fails here.
          if found=$(docker buildx imagetools inspect "$IMAGE:$version" 2>&1); then
            echo "The registry has the image of $version."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif grep -qiE "not found|manifest unknown" <<< "$found"; then
            echo "The registry has no image of $version: it is built from $commit."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "$found"
            exit 1
          fi

  # Each platform on a runner of its own, so nothing is built under emulation, and pushed without
  # a name: the release is named by the job after this one, once both are there.
  image-build:
    name: Build the image (${{ matrix.arch }})
    needs: image-plan
    if: ${{ !cancelled() && needs.image-plan.result == 'success' && needs.image-plan.outputs.build == 'true' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # the image, in this repository's own container registry
    # One output per platform: a job of a matrix gives the outputs of all its runs together.
    outputs:
      amd64: ${{ steps.pushed.outputs.amd64 }}
      arm64: ${{ steps.pushed.outputs.arm64 }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-plan.outputs.commit }}
          persist-credentials: false
      - name: Sign in to the registry with the token of this job
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # What the server of this image says of itself (ADR-0133).
          build-args: |
            VERSION=${{ needs.image-plan.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.image-plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.image-plan.outputs.commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: What was pushed
        id: pushed
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$ARCH=$DIGEST" >> "$GITHUB_OUTPUT"

  image:
    name: Publish the image
    needs: [image-plan, image-build]
    if: ${{ !cancelled() && needs.image-plan.result == 'success' && needs.image-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write # the names of the image, in this repository's own container registry
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Sign in to the registry with the token of this job
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      # The one step that names anything, and it names both platforms at once, each with its
      # provenance and its list of contents: a tag never means an image of one platform.
      - name: Name the image of both platforms
        env:
          VERSION: ${{ needs.image-plan.outputs.version }}
          AMD64: ${{ needs.image-build.outputs.amd64 }}
          ARM64: ${{ needs.image-build.outputs.arm64 }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$AMD64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
