name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. CI never needs secrets, so pull requests from forks are safe to run.
permissions:
  contents: read

jobs:
  check:
    name: Lint, build, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Integration tests run against real PostgreSQL, same version and credentials as
    # deploy/compose.dev.yaml. Throwaway values: the database lives for the length of the job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skillcdn
          POSTGRES_PASSWORD: skillcdn-dev-only
          POSTGRES_DB: skillcdn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillcdn -d skillcdn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://skillcdn:skillcdn-dev-only@127.0.0.1:5432/skillcdn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner'

  image:
    name: Image build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The image is exercised against a real database: packaging mistakes (a missing migrations
    # folder, a dependency that did not make it into the image) only show up there.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skillcdn
          POSTGRES_PASSWORD: skillcdn-dev-only
          POSTGRES_DB: skillcdn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillcdn -d skillcdn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://skillcdn:skillcdn-dev-only@127.0.0.1:5432/skillcdn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: skillcdn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exit codes (64 for an unknown role, 78 for invalid configuration)
        run: |
          set +e
          docker run --rm skillcdn:ci not-a-role
          usage=$?
          docker run --rm skillcdn:ci api
          config=$?
          set -e
          test "$usage" -eq 64
          test "$config" -eq 78
      - name: Migrate, serve, become ready, shut down cleanly
        run: |
          docker run --rm --network host -e DATABASE_URL skillcdn:ci migrate
          docker run -d --name api --network host -e DATABASE_URL skillcdn:ci api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11188/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11188/readyz
          test "$(docker exec api id -u)" -ne 0
          # The web UI ships in the image: a page per language, and the render module for addresses.
          # An address that is not one is rendered without asking the git host, which CI never does.
          curl -fsS -H 'accept: text/html' 'http://127.0.0.1:11188/' | grep -q '<html lang="en">'
          curl -fsS -H 'accept: text/html' 'http://127.0.0.1:11188/?lang=ko' | grep -q '<html lang="ko">'
          curl -sS -H 'accept: text/html' 'http://127.0.0.1:11188/gh/skillcdn' | grep -q 'data-prerendered="bad-address"'
          curl -fsS 'http://127.0.0.1:11188/sitemap.xml' | grep -q 'hreflang="ko"'
          curl -fsS 'http://127.0.0.1:11188/api/v1/featured' | grep -q '"items"'
          docker stop --time 30 api
          test "$(docker inspect --format '{{.State.ExitCode}}' api)" -eq 0
          docker logs api
