packages:
  - "apps/*"
  - "packages/*"

# One version per shared tool. Workspace packages reference these as "catalog:".
catalog:
  "@hono/node-server": ^2.1.5
  "@modelcontextprotocol/client": ^2.3.1
  "@modelcontextprotocol/server": ^2.3.1
  "@types/node": ^24.19.2
  hono: ^4.13.13
  typescript: ^7.0.2
  vitest: ^5.0.5
  zod: ^4.6.7

# Supply-chain guard: never resolve a version published less than 3 days ago (minutes).
# For an urgent security fix, list the package under minimumReleaseAgeExclude in the same PR.
minimumReleaseAge: 4320

# Dependency install scripts run only for packages approved here (`pnpm approve-builds`).
allowBuilds:
  esbuild: true
