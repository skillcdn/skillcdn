# The self-hosting bundle: the one image in its roles and PostgreSQL with the vector extension on
# one host, behind a reverse proxy of your own (deploy/README.md, "Running with compose").
#
#   docker build -f deploy/Dockerfile -t skillcdn:local .   # or name an image of yours in SKILLCDN_IMAGE
#   cp .env.example deploy/.env                              # then set POSTGRES_PASSWORD and your settings
#   docker compose -f deploy/compose.yaml up -d
#
# The search by meaning is added by the overlays beside this file: compose.meaning.yaml for the
# embedding server, compose.rerank.yaml for the reranker, compose.gpu.yaml for an NVIDIA GPU.
# Settings come from deploy/.env, which the containers read and this file reads for its own
# variables; the file is ignored by git. Ports bind to 127.0.0.1.
name: skillcdn

x-server: &server
  image: ${SKILLCDN_IMAGE:-skillcdn:local}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-skillcdn}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-skillcdn}
  restart: unless-stopped
  # Above SHUTDOWN_GRACE_SECONDS (20 by default): a stop lets requests and jobs in flight finish.
  stop_grace_period: 30s

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillcdn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-skillcdn}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillcdn} -d ${POSTGRES_DB:-skillcdn}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Brings the schema and the job queue up to this image, then exits; the others start after it.
  migrate:
    <<: *server
    command: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    command: api
    ports:
      - "127.0.0.1:${SKILLCDN_PORT:-11188}:${PORT:-11188}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 11188) + '/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *server
    command: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
